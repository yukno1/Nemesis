# NexusAgent 默认配置
# 覆盖优先级：环境变量(NX_ 前缀) > config.{env}.yaml > config.yaml
# 环境变量映射示例：http.port -> NX_HTTP__PORT

env: dev
http:
  port: 8080
  shutdown_timeout: 10s

log:
  level: info # debug/info/warn/error
  format: json # json/console

db:
  mode: sqlite # pg / sqlite

sqlite:
  path: ./.minerva/minerva.sqlite

pg:
  dsn: postgres://nexus:nexus123@localhost:5432/nexus_agent?sslmode=disable&search_path=public
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: 127.0.0.1:6380 # 与 docker-compose 的 6380:6379 映射一致
  password: ""
  db: 0

vector:
  driver: qdrant # milvus | qdrant | off
  dim: 1024 # bge-m3 维度，两种后端共用

milvus:
  mode: off # remote / lite
  addr: 127.0.0.1:19530
  lite_path: ./data/milvus_lite.db
  dim: 1024 # bge-m3 向量维度

qdrant:
  mode: remote # remote / lite
  addr: 127.0.0.1:6334 # gRPC（SDK 用这个）
  rest_addr: 127.0.0.1:6333 # REST（管理/健康检查用，可选）
  api_key: "" # 本地无需；Qdrant Cloud 才填
  https: false # Qdrant Cloud 时 true

object_storage:
  driver: seaweedfs # rustfs | seaweedfs
  endpoint: 127.0.0.1:9000
  access_key: minervaadmin
  secret_key: minervaadmin
  bucket: minerva-docs
  use_ssl: false

rustfs:
  endpoint: 127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: minerva-docs
  use_ssl: false

seaweedfs:
  endpoint: 127.0.0.1:8333
  access_key: "" # SeaweedFS S3 默认匿名可读写，留空也能通
  secret_key: ""
  bucket: minerva-docs
  use_ssl: false

jwt:
  secret: change-me-in-prod # 生产务必更换
  access_ttl: 15m
  refresh_ttl: 168h

secret_key: change-me-32-bytes!! # 敏感配置 AES-GCM 主密钥(16/24/32字节)

llm:
  # 并发与熔断
  max_conns_per_provider: 16
  circuit_error_rate: 0.3 # 错误率熔断阈值
  circuit_open: 60s # 熔断持续时间
  retry_max: 3 # 指数退避重试次数
  stream_first_token_timeout: 30s
  local: true # true 时使用 ollama 本地模型跑通全流程
  default_chat: qwen3:4b
  default_embedding: qwen3-embedding:0.6b

rag:
  chunk_size: 512
  chunk_overlap: 64
  dense_top_k: 25
  sparse_top_k: 25
  fused_top_n: 15
  final_top_k: 5
  rrf_k: 60
  score_threshold: 0.35
  batch_embed: 64

agent:
  max_iterations: 10
  step_timeout: 60s
  run_timeout: 5m
  memory_extract_every: 6 # 每 N 条消息触发一次长期记忆抽取

worker:
  concurrency: 4
  max_retry: 3
  claim_interval: 30s # XAUTOCLAIM 收尸间隔

sandbox:
  enabled: false # P0 基础版默认关闭，Ep 15 打开
  image: nexus/sandbox:latest
  memory: 512m
  cpus: "1"
  timeout: 30s
  pool_size: 2

observability:
  otel_endpoint: http://127.0.0.1:4318 # Jaeger OTLP HTTP
  otel_enabled: true
  metrics_enabled: true

mcp:
  enabled: true
  health_interval: 60s

a2a:
  enabled: true
  port: "8082" # 对外 A2A 端点（/.well-known/agent.json + /a2a）
  name: NexusAgent
  desc: 通用智能体平台：ReAct / RAG / 多智能体协作

search:
  searxng_url: http://127.0.0.1:8081/search
